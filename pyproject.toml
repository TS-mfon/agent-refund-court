[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-refund-court-contracts"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
contracts = [
  "genvm-linter==0.11.0",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests/contracts"]
addopts = "-q"

[tool.coverage.run]
source = ["contracts"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
